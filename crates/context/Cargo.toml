[package]
name = "yog-context"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace crates
yog-core = { path = "../core" }
yog-persistence = { path = "../persistence" }
yog-bootstrap = { path = "../bootstrap" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Solana
solana-pubkey = { workspace = true }

# Pool account decoding (base64 RPC payload)
base64 = { workspace = true }

# Errors / logging / config
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Misc
chrono = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# `DebuggingRecorder` + `with_local_recorder`: lets a test assert on the price
# worker's coverage gauge and tick outcomes. Thread-local, so it stays safe
# under the parallel test harness. Same dev-only dependency as yog-indexer —
# the `debugging` feature is not free, but none of it reaches a binary.
metrics-util = { workspace = true, features = ["debugging"] }
# `SecretKey::for_tests`: the price client now holds the API key typed, and a
# test has no environment to read one from. Dev-only on purpose — enabling it
# as a normal dependency would reopen the door this ticket closed.
yog-bootstrap = { path = "../bootstrap", features = ["test-support"] }
