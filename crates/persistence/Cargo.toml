[package]
name = "yog-persistence"
version = "0.1.0"
edition = "2024"
license.workspace = true
# Every `.rs` directly under tests/ would otherwise become its own test binary,
# relinking the whole crate each time. One declared target (see [[test]] below),
# every other file is a plain module of it.
autotests = false

[[bin]]
name = "yog-migrate"
path = "src/bin/migrate.rs"

[features]
# Enables DB-backed integration tests (sqlx::test). Off by default so
# a plain `cargo test` stays fast and DB-free; the CI job
# `test-integration` turns it on against a real Postgres.
integration-tests = []

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
# Workspace crates
yog-core = { path = "../core" }
yog-bootstrap = { path = "../bootstrap" }

# Database
sqlx = { workspace = true, default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "macros",
  "chrono",
  "bigdecimal",
  "uuid",
  "rust_decimal",
  "migrate",
  # Reads `sqlx.toml` beside this manifest: with both decimal crates enabled,
  # the `query!` macros need to be told which one maps NUMERIC.
  "sqlx-toml",
] }
bigdecimal = { workspace = true }
rust_decimal = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Solana
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }

# Errors / logging / config
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }

# Misc
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# `SecretUrl::for_tests`, reachable from tests only — see yog-bootstrap's
# Cargo.toml for why it is a dev-dependency feature.
yog-bootstrap = { path = "../bootstrap", features = ["test-support"] }
# The fake `pg_dump` of `backup`'s tests lives in a temporary directory.
tempfile = "3"
# Integration tests will spin up a real Postgres via docker-compose
tokio = { workspace = true, features = ["test-util", "macros"] }
# `conformance::reference_transaction` — the neutral form of the mainnet
# transaction `event_index_uniqueness` replays through the real extractor.
# Shared with the source adapters, so this test and they cannot disagree about
# what that transaction is.
yog-core = { path = "../core", features = ["test-support"] }
