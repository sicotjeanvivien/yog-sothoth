[package]
name = "yog-bootstrap"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Opens `SecretKey::for_tests` / `SecretUrl::for_tests` to other crates' tests.
# Never enabled by a normal dependency — only as a dev-dependency, so the
# constructors stay unreachable from production code, which is what makes
# "a secret is wrapped by the helper" a compiler guarantee rather than a habit.
test-support = []

[dependencies]
# Errors
thiserror = { workspace = true }
# `shutdown`: the verdict a stop hands back, once every stage has answered.
anyhow = { workspace = true }

# `shutdown`: the signals that mean "stop", and joining what is still in flight
# under a bounded grace. This crate is the shared startup plumbing, and a stop
# is the other end of the same lifecycle.
tokio = { workspace = true }

# Logging / TLS runtime init
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
# `start_paused`: lets the grace expire without waiting five real seconds, and
# lets the "two stages share one deadline" test read the clock instead of
# trusting the code that sets it. A feature of a crate already in the tree,
# dev-only.
tokio = { workspace = true, features = ["test-util"] }
