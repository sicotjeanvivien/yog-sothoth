[package]
name = "yog-api"
version = "0.9.0"
edition = "2024"
license.workspace = true

[dependencies]
# Workspace crates
yog-core = { path = "../core" }
yog-persistence = { path = "../persistence" }
yog-bootstrap = { path = "../bootstrap" }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Solana
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }

# Shared-result cache
moka = { workspace = true }

# Prometheus on :9000, like the daemons
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Misc
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
# The live token: an HS256 JWT, its id drawn from the OS.
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
rust_decimal = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# `SecretKey::for_tests`, to check the live token secret at boot.
yog-bootstrap = { path = "../bootstrap", features = ["test-support"] }
async-trait = { workspace = true }
# The `debugging` recorder, to read a counter in a test.
metrics-util = { workspace = true, features = ["debugging"] }
# `test-util`: `tokio::time::pause`/`advance`, to age the shared-result cache
# without sleeping through its TTL.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
