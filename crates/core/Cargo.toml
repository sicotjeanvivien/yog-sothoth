[package]
name = "yog-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["solana"]
# `Pubkey` — the address type every domain entity carries, and since 31 August
# 2026 the only thing behind this feature. ⚠️ Optional in name only: `Pubkey` is
# imported unconditionally across `domain/`, so `--no-default-features` does not
# compile (75 errors, measured). Making it truly optional is a separate job —
# gating every domain type — and nothing needs it until a wasm build does.
solana = ["dep:solana-pubkey"]
wasm = []
# Exposes `application::extraction::conformance` — the shared expectation every
# source adapter must satisfy, plus the reference transaction it is proven on.
# Enabled by the dev-dependencies of the crates that host those adapters and
# their tests; it reaches no binary.
test-support = []

[dependencies]
# Serialization / encoding
serde = { workspace = true }
borsh = { workspace = true }
sha2 = { workspace = true }

# Solana
solana-pubkey = { workspace = true, optional = true, default-features = false }
solana-signature = { workspace = true }

# Misc
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
