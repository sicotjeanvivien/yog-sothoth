[package]
name = "yog-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace crates
yog-core = { path = "../core" }
yog-persistence = { path = "../persistence" }
yog-bootstrap = { path = "../bootstrap" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
# `ReceiverStream`: the outbound half of the Yellowstone stream.
tokio-stream = { workspace = true }
tokio-retry = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Solana
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-commitment-config = { workspace = true }
solana-pubsub-client = { workspace = true }
solana-pubkey = { workspace = true }

# Serialization
serde_json = { workspace = true }
# The JSON-RPC transaction shape and its base58 payloads: read by
# `infra::rpc::transaction_adapter`, which turns them into the neutral
# `OnChainTransaction`. They live here rather than in `yog-core` because `core`
# has no business naming a transport.
solana-transaction-status-client-types = { workspace = true }
bs58 = { workspace = true }
solana-signature = { workspace = true }
# The protobuf transaction shape, read by `infra::grpc::transaction_adapter`.
# Same reasoning as the line above, one transport over: `core` names no
# transport, so both adapters and both schemas live in this crate.
#
# `tonic` un-gates the generated `geyser_client::GeyserClient` — the schema's
# own client stubs, generated here by `prost`/`tonic-prost` from the public
# `.proto`. That is not the `yellowstone-grpc-client` crate the root
# `Cargo.toml` refuses: no connection policy, no authentication, no
# reconnection, and nothing that prints a token. Slices 1 and 2 needed the
# types only; `infra::grpc::listener` needs the stub.
yellowstone-grpc-proto = { workspace = true, features = ["tonic"] }
# The channel under that stub, plus TLS — see the root `Cargo.toml` for why
# these two TLS features and not the other two.
tonic = { workspace = true }

# Errors / logging / config
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Misc
chrono = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
# `DebuggingRecorder` + `with_local_recorder`: lets a test assert on the
# counters the persistor emits. Thread-local, so it stays safe under the
# parallel test harness. The crate was already in the tree via
# metrics-exporter-prometheus, but its `debugging` feature is not free — it
# pulls `endian-type`, `nibble_vec`, `ordered-float` and `radix_trie` into
# Cargo.lock. Dev-only, so none of it reaches a binary.
metrics-util = { workspace = true, features = ["debugging"] }
# `conformance::reference_transaction` — the expectation every source adapter
# must satisfy, which `transaction_adapter`'s tests pin to the mainnet fixture.
yog-core = { path = "../core", features = ["test-support"] }
# `SecretKey::for_tests` — the credential the gRPC interceptor tests put on a
# request and then look for in every printed form. A dev-dependency, so the
# constructor stays unreachable from production code.
yog-bootstrap = { path = "../bootstrap", features = ["test-support"] }
