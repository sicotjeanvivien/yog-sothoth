[package]
name = "yog-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace crates
yog-core = { path = "../core" }
yog-persistence = { path = "../persistence" }
yog-bootstrap = { path = "../bootstrap" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-retry = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Solana
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-commitment-config = { workspace = true }
solana-pubsub-client = { workspace = true }
solana-pubkey = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Errors / logging / config
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Misc
chrono = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
# `DebuggingRecorder` + `with_local_recorder`: lets a test assert on the
# counters the persistor emits. Thread-local, so it stays safe under the
# parallel test harness. The crate was already in the tree via
# metrics-exporter-prometheus, but its `debugging` feature is not free — it
# pulls `endian-type`, `nibble_vec`, `ordered-float` and `radix_trie` into
# Cargo.lock. Dev-only, so none of it reaches a binary.
metrics-util = { workspace = true, features = ["debugging"] }
# Construct dummy Signatures in the event-persistor dispatch tests.
solana-signature = { workspace = true }
