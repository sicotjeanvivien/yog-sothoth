# docker-compose.prod.yml — the production shape, as an overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d
#
# Our images come from GHCR, renamed `yog-*:prod` by docker/pull-images.sh
# (docker/README.md).
#
# On the server, put the two selectors in its .env and the command shrinks
# back to `docker compose up -d`:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#   COMPOSE_PROFILES=full
#
# That command starts a server whose images are pulled (docker/README.md,
# "A new server"). To UPDATE one already in service, run
# docker/update.sh instead: a bare `up -d` migrates while the previous
# daemons are still running, and its header says what that costs.
#
# Why an overlay and not a `prod` profile
# ---------------------------------------
# A profile only chooses WHICH services start; it cannot change a single
# setting of a service. Everything that separates production from dev is a
# setting of a service that already exists — the TimescaleDB scheduler, the
# published ports, the Postgres password. A `prod` profile would start the
# same services with the dev settings: open ports, scheduler off, password
# `yog`.
#
# And one difference cannot live in a single file at all: docker-compose.yml
# must keep `timescaledb.max_background_workers=0`, which the DB-backed
# integration tests depend on (its comment says why), while production must
# run the scheduler — without it nothing is compressed, nothing is dropped
# by retention, and no continuous aggregate is materialized, with no error.
#
# Requirements
# ------------
# - Compose >= 2.24 for `!reset`. Compose MERGES list fields such as `ports`
#   across files: without `!reset`, every port published by the base file
#   would stay published here.
# - The external network `edge` (`docker network create edge`, once per
#   server). The server's entry proxy, a Caddy in its own stack shared by
#   every site on the machine, publishes 80/443 and reaches yog-web and
#   yog-api over it; this stack publishes no port.
#
# Variables this file requires (each refuses the command when unset):
#   POSTGRES_PASSWORD  the admin password of the Postgres container
#   YOG_WEB_DOMAIN     the dashboard's host name, e.g. yog-scope.xyz
#   DATABASE_URL_ARCHIVE, ARCHIVE_STORE_URL, ARCHIVE_STORE_BUCKET,
#   ARCHIVE_STORE_REGION, ARCHIVE_STORE_ACCESS_KEY, ARCHIVE_STORE_SECRET_KEY,
#   ARCHIVE_HEARTBEAT_URL
#                      the backup daemon's role, bucket and dead man's switch;
#                      what the bucket and its key must be is in
#                      crates/archive/README.md, "Deploying"
#   SIGNALS_MATERIALIZATION_HEARTBEAT_URL
#                      the check yog-signals fails when a continuous aggregate
#                      stops being materialised (period 10 min, grace 20 min);
#                      crates/signals/README.md, "The materialisation alarm"
#   INDEXER_HEARTBEAT_URL
#                      the check yog-indexer fails when the ingestion stops
#                      writing events (period 5 min, grace 10 min);
#                      crates/indexer/README.md, "The ingestion alarm"
#   ANALYTIC_HEARTBEAT_URL
#                      the check yog-analytic pings after each cycle and fails
#                      when one fails (period 5 min); crates/analytic/README.md
# The CORS origin is derived from the domain rather than set separately: two
# values that must agree are one value.
#
# Memory
# ------
# Every service has a `mem_limit`. The machine is shared with other projects,
# and without limits the first service to grow gets Postgres killed by the
# OOM killer. The API's limit is sized against its capacity bounds rather
# than a peak (see below).
#
# Postgres's memory and connection settings are written here, not left to
# `timescaledb-tune`. The image runs it once, when the volume is created, and
# sizes everything from whatever memory it sees at that moment: the cgroup
# limit when there is one, the host's RAM when there is not. Neither is safe
# to inherit:
#   - a volume first created WITHOUT this overlay (the base file alone, before
#     COMPOSE_FILE is set on the server) is tuned to the host, and its
#     maintenance_work_mem alone can exceed this container's limit;
#   - a volume created WITH it is tuned to this container's limit, and the
#     max_connections it derives falls short of the pools: the four daemons
#     hold ten connections each — yog-signals and yog-indexer one more each,
#     their alarm's own pool — yog-analytic one, and yog-archive one while a
#     dump runs: 44 in all, refused "too many clients" under load.
# Command-line `-c` settings override postgresql.conf, so these hold whichever
# way the volume was created. ⚠️ The limit counts the page cache too, which
# Postgres reads through: a limit near its working set sends the reads to
# disk. 512MB of shared_buffers, a quarter of 2000M, leaves room for 50
# connections at 4MB of work_mem each, the compression jobs' 64MB of
# maintenance_work_mem, and that cache, which effective_cache_size describes
# to the planner. ⚠️ shared_buffers counts against the limit too: a larger
# share starves the connections and gets Postgres OOM-killed at the first peak.

services:
  postgres:
    # A versioned tag, the same as the base file's, never a `latest-pg18`
    # that pins only the Postgres major. A dump restores only into the SAME TimescaleDB version
    # (crates/persistence/README.md, "Backup and restore"), so a `pull` that
    # silently moved the version would strand every dump taken before it.
    # Upgrading is a decision: change this line, then take a fresh dump.
    image: timescale/timescaledb:2.30.2-pg18
    command:
      - postgres
      - -c
      - timescaledb.max_background_workers=8
      # TimescaleDB reports usage statistics to its vendor once a day by
      # default (the `policy_telemetry` job). Off: production data leaves
      # this machine only by our choice.
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    environment:
      # Read by the image only when it creates the data directory. On a volume
      # that already exists, this check passes and the admin password is
      # still whatever it was created with: change it with
      # `ALTER ROLE yog PASSWORD …` (as `\password` in psql), or recreate the
      # volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in the server's .env — production has no default password}
    ports: !reset []
    mem_limit: 2000m
    # ⚠️ Stopped with SIGINT (fast shutdown), which ends on a checkpoint: past
    # Docker's 10 s default it is killed, and the next start replays the WAL.
    stop_grace_period: 2m
    # The base file has no restart policy for Postgres. In production the
    # database must come back on its own after the host reboots, or every
    # daemon restarts in a loop against a host name that does not resolve.
    restart: unless-stopped

  yog-migrate:
    image: yog-migrate:prod
    build: !reset null
    mem_limit: 32m

  yog-indexer:
    image: yog-indexer:prod
    build: !reset null
    ports: !reset []
    # The ingestion alarm's dead man's switch. Required here, as the other two
    # are: without it an ingestion that stops writing is logged in a container
    # nobody reads, and the process itself stays up.
    environment:
      INDEXER_HEARTBEAT_URL: ${INDEXER_HEARTBEAT_URL:?set it in the server's .env}
    mem_limit: 64m

  yog-api:
    image: yog-api:prod
    build: !reset null
    environment:
      API_CORS_ALLOWED_ORIGINS: https://${YOG_WEB_DOMAIN:?set it in the server's .env (e.g. yog-scope.xyz)}
    ports: !reset []
    networks: [default, edge]
    # Sized against the API's own bounds, not its idle peak: with at most
    # MAX_CONNECTIONS (400) connections and MALLOC_ARENA_MAX=2 (both in
    # crates/api/src/http/middleware/capacity.rs and the yog-api image),
    # twelve rounds of 1000 signal-stream opens level off at 44.1 MiB. 32 MiB,
    # sized on the 6.3 MiB peak of a run without streams, was OOM-killed by
    # one client opening streams (measured 25 September 2026).
    mem_limit: 64m

  yog-context:
    image: yog-context:prod
    build: !reset null
    ports: !reset []
    # ⚠️ Size it on anonymous memory plus swap: the peak stops at the limit, the rest is in swap.
    mem_limit: 64m

  yog-signals:
    image: yog-signals:prod
    build: !reset null
    ports: !reset []
    # The materialisation alarm's dead man's switch. Required here, as the
    # archive's is: without it a stalled continuous aggregate is logged in a
    # container nobody reads, and the whole point is that someone is told.
    environment:
      SIGNALS_MATERIALIZATION_HEARTBEAT_URL: ${SIGNALS_MATERIALIZATION_HEARTBEAT_URL:?set it in the server's .env}
    mem_limit: 64m

  yog-analytic:
    image: yog-analytic:prod
    build: !reset null
    ports: !reset []
    environment:
      ANALYTIC_HEARTBEAT_URL: ${ANALYTIC_HEARTBEAT_URL:?set it in the server's .env}
    mem_limit: 32m

  yog-web:
    image: yog-web:prod
    build: !reset null
    ports: !reset []
    networks: [default, edge]
    mem_limit: 128m

  # The backup daemon: a pg_dump every six hours, streamed to the bucket and
  # checked, then signalled to Healthchecks.io. Production only: without a
  # real bucket and a real check it has nothing to do in dev.
  yog-archive:
    profiles: ["full"]
    image: yog-archive:prod
    environment:
      DATABASE_URL_ARCHIVE: ${DATABASE_URL_ARCHIVE:?set it in the server's .env}
      ARCHIVE_STORE_URL: ${ARCHIVE_STORE_URL:?set it in the server's .env}
      ARCHIVE_STORE_BUCKET: ${ARCHIVE_STORE_BUCKET:?set it in the server's .env}
      ARCHIVE_STORE_REGION: ${ARCHIVE_STORE_REGION:?set it in the server's .env}
      ARCHIVE_STORE_ACCESS_KEY: ${ARCHIVE_STORE_ACCESS_KEY:?set it in the server's .env}
      ARCHIVE_STORE_SECRET_KEY: ${ARCHIVE_STORE_SECRET_KEY:?set it in the server's .env}
      ARCHIVE_HEARTBEAT_URL: ${ARCHIVE_HEARTBEAT_URL:?set it in the server's .env}
      ARCHIVE_INTERVAL_SECS: ${ARCHIVE_INTERVAL_SECS:-21600}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    entrypoint:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL_ARCHIVE="$$(echo "$$DATABASE_URL_ARCHIVE" | sed 's|@localhost:5433/|@postgres:5432/|')"
        exec /usr/local/bin/yog-archive
    # `depends_on` holds at `compose up`, not when the host reboots: Docker
    # then restarts containers in no set order, and a first run before
    # Postgres is up ends in `refused` — signalled, and the next dump comes
    # a full interval later.
    depends_on:
      postgres:
        condition: service_healthy
      yog-migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

networks:
  edge:
    external: true
