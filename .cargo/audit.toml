# cargo-audit configuration — read by `rustsec/audit-check@v2` in CI.
#
# Each ignore must justify itself. An undocumented entry here will
# rot into "we don't know why this is ignored anymore" within months;
# the comment is the contract with the future reader (and with the
# CI gate that justified adding it).

[advisories]
ignore = [
  # ─────────────────────────────────────────────────────────────────
  # RUSTSEC-2025-0141 — `bincode 1.3.3` unmaintained (informational)
  #
  # Status: ACCEPTED.
  #
  # `bincode 1.3.3` is pulled transitively by the Solana SDK for
  # transaction serialisation. We cannot drop it without dropping
  # Solana SDK itself. The crate is functional and feature-complete
  # at 1.3.3 — the maintainers stopped due to a doxxing incident, not
  # because the code is broken.
  #
  # This is an "informational: unmaintained" advisory, not a
  # vulnerability. Solana itself will migrate the day the ecosystem
  # picks a successor; we follow.
  "RUSTSEC-2025-0141",

  # ─────────────────────────────────────────────────────────────────
  # RUSTSEC-2026-0543 — `chrono` unmaintained (informational)
  #
  # Status: ACCEPTED until our crates and their dependencies leave it.
  #
  # Every instant we hold is a `chrono` type: eight workspace crates
  # depend on it directly, `sqlx` maps `TIMESTAMPTZ` to it (its
  # `chrono` feature), `utoipa` describes it, and `object_store` pulls
  # it in regardless. The maintainer winds it down and points to
  # `jiff`; no vulnerability is known.
  #
  # Remove this entry once `cargo tree -i chrono --workspace
  # --target all` prints nothing.
  "RUSTSEC-2026-0543",

  # ─────────────────────────────────────────────────────────────────
  # RUSTSEC-2026-0542 — `humantime` unmaintained (informational)
  #
  # Status: ACCEPTED until `object_store` drops it.
  #
  # Only `object_store` (yog-archive's S3 client) pulls it in; nothing
  # of ours calls it. It wraps `chrono`, hence the advisory.
  #
  # Remove this entry the day Dependabot brings an `object_store`
  # without `humantime` (`cargo tree -i humantime --workspace
  # --target all` prints nothing).
  "RUSTSEC-2026-0542",
]
