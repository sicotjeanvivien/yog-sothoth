# cargo-audit configuration — read by `rustsec/audit-check@v2` in CI.
#
# Each ignore must justify itself. An undocumented entry here will
# rot into "we don't know why this is ignored anymore" within months;
# the comment is the contract with the future reader (and with the
# CI gate that justified adding it).

[advisories]
ignore = [
  # ─────────────────────────────────────────────────────────────────
  # RUSTSEC-2025-0141 — `bincode 1.3.3` unmaintained (informational)
  #
  # Status: ACCEPTED.
  #
  # `bincode 1.3.3` is pulled transitively by the Solana SDK for
  # transaction serialisation. We cannot drop it without dropping
  # Solana SDK itself. The crate is functional and feature-complete
  # at 1.3.3 — the maintainers stopped due to a doxxing incident, not
  # because the code is broken.
  #
  # This is an "informational: unmaintained" advisory, not a
  # vulnerability. Solana itself will migrate the day the ecosystem
  # picks a successor; we follow.
  "RUSTSEC-2025-0141",

  # ─────────────────────────────────────────────────────────────────
  # RUSTSEC-2026-0391 (`zstd 0.13.3`), RUSTSEC-2026-0398 and
  # RUSTSEC-2026-0403 (`zstd-safe 7.3.0`) — decompression flaws — and
  # the ten "unsound" advisories on `zstd-safe 7.3.0`, 0395 to 0402 and
  # 0404 to 0406, all patched only from `zstd-safe 8.2`, which
  # `zstd 0.13` cannot take (`^7.1`)
  #
  # Status: ACCEPTED until a stable Agave release moves to `zstd 0.14`.
  #
  # `solana-rpc-client` 4.3 requires `solana-account-decoder`, which
  # requires `zstd ^0.13.3` with no feature to drop it; only the 4.4
  # betas move to `^0.14`. Its zstd calls are `UiAccountData::decode`
  # and `encode_ui_account`, on `base64+zstd` account data, and nothing
  # here reaches either: the indexer reads transactions as `jsonParsed`
  # and never encodes or decodes an account, and yog-context fetches
  # accounts in plain `base64` through its own JSON-RPC client.
  #
  # Remove these thirteen the day Dependabot brings a stable Agave whose
  # `solana-account-decoder` takes `zstd >= 0.14.3`.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0395",
  "RUSTSEC-2026-0396",
  "RUSTSEC-2026-0397",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0399",
  "RUSTSEC-2026-0400",
  "RUSTSEC-2026-0401",
  "RUSTSEC-2026-0402",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0404",
  "RUSTSEC-2026-0405",
  "RUSTSEC-2026-0406",
]
