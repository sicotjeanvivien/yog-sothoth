# What Dependabot never proposes is in versions-checked-by-hand.md, beside this file.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/docker, /web]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
