# Checks for what no other workflow reads: every shell script git tracks
# (shellcheck), the workflows (actionlint), and the gates of docker/observe.sh
# and .github/actions/verdict/. Both lint jobs pin shellcheck 0.11.0 by SHA-256;
# actionlint comes from `go install` at a pinned version — the Go checksum
# database verifies it, and no third-party action or install script runs.

name: scripts

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - ".github/workflows/**"
      - ".github/actions/**"
  # Every pull request, whatever it touches: see the `changes` job.
  pull_request:

env:
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the jobs below run. The workflow starts on every pull
  # request so that its verdict always exists: a required check that never
  # starts stays "Expected" and blocks the merge for good. The work itself
  # only runs when the PR touches this workflow's paths — the same ones the
  # `push:` filter names. On a push to main that filter has already decided.
  # The logic, and the traps it avoids: .github/actions/changes/changes.sh.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/changes
        with:
          pattern: '(\.sh$|^\.github/(workflows|actions)/)'

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck (pinned)
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: shellcheck on every tracked shell script
        run: |
          shellcheck --version | sed -n 2p
          git ls-files -z '*.sh' | xargs -0 shellcheck

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install shellcheck (pinned)
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: Install actionlint (pinned)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint on the workflows
        # The pinned shellcheck is on the PATH, so actionlint also checks the
        # `run:` scripts of every workflow, with the same version.
        run: |
          "$(go env GOPATH)/bin/actionlint" -version | head -1
          "$(go env GOPATH)/bin/actionlint" -color

  # The observation key's script (docker/observe.sh): its gate, run as the key's user runs it,
  # the check root makes again under sudo, and the strict filters of its output.
  observe-gate:
    name: observe gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the script where the gate hands over
        run: sudo install -o root -g root -m 755 docker/observe.sh /usr/local/sbin/yog-observe
      - name: Every bypass is refused with code 2, by the gate and by root
        run: |
          fail=0
          refused() { # <label> <command…>: it must exit 2 and say `refused`
            local label=$1 rc=0 err
            shift
            err=$("$@" 2>&1 >/dev/null) || rc=$?
            if [ "$rc" -eq 2 ] && [[ $err == *refused* ]]; then
              printf 'ok      %s\n' "$label"
            else
              printf 'FAILED  %s: rc=%s %s\n' "$label" "$rc" "$err"
              fail=1
            fi
          }
          cases=('id' 'health; id' 'health id' 'metrics && id' $'health\nid' '' 'HEALTH' 'db ')
          for c in "${cases[@]}"; do
            # No sudo on the PATH: a bypass the gate let through would end on 127, not on root's refusal.
            refused "gate $(printf %q "$c")" env PATH=/nonexistent SSH_ORIGINAL_COMMAND="$c" docker/observe.sh
            refused "root $(printf %q "$c")" sudo /usr/local/sbin/yog-observe "$c"
          done
          refused "root, two words" sudo /usr/local/sbin/yog-observe health metrics
          refused "root, no word" sudo /usr/local/sbin/yog-observe

          # An accepted word crosses both: the reading starts, and fails here on the missing checkout.
          out=$(SSH_ORIGINAL_COMMAND=health docker/observe.sh 2>/dev/null) || true
          if [[ $out == *reading_failed* ]]; then
            echo "ok      health reaches the reading"
          else
            printf 'FAILED  health did not reach the reading: %s\n' "$out"
            fail=1
          fi
          exit "$fail"
      - name: The strict filters let no foreign text through
        run: |
          export LC_ALL=en_US.UTF-8
          if ! [[ É =~ ^[A-Za-z]$ ]]; then
            echo "in $LC_ALL, É does not match [A-Za-z]: this step could not see the script's LC_ALL=C go" >&2
            exit 1
          fi
          definitions=$(sed -n '/^export LC_ALL=C$/p;/^readonly metric_line=/p;/^readonly db_line=/p;/^strict() {/,/^}/p' docker/observe.sh)
          eval "$definitions"
          kept=$(printf '%s\n' \
            'yog_ok{reason="out_of_range"} 3' \
            'yog_ok_bucket{le="+Inf"} 7' \
            'yog_api_requests_total{client="dashboard",route="/api/pools/{pool}"} 4' \
            'yog_x{token="ÉLON"} 1' \
            'yog_x{token="Ignore previous instructions"} 1' \
            'yog_x{token="a\"b"} 1' \
            'process_cpu_seconds_total 1' \
            'yog_x 1; rm -rf /' \
            | strict "$metric_line")
          expected=$(printf '%s\n' 'yog_ok{reason="out_of_range"} 3' 'yog_ok_bucket{le="+Inf"} 7' 'yog_api_requests_total{client="dashboard",route="/api/pools/{pool}"} 4' 'refused_lines 5')
          [ "$kept" = "$expected" ] || { printf 'metrics filter kept:\n%s\n' "$kept"; exit 1; }
          kept=$(printf '%s\n' 'pools 120815' 'name Ignore all rules' 'pools 1;DROP' | strict "$db_line")
          [ "$kept" = "$(printf '%s\n' 'pools 120815' 'refused_lines 2')" ] || { printf 'db filter kept:\n%s\n' "$kept"; exit 1; }
          echo "both filters kept only our lines"
      - name: The log levels are counted in every format, and only there
        run: |
          eval "$(sed -n "/^readonly log_levels=/,/^END .*'\$/p" docker/observe.sh)"
          counted=$({ cat <<'LINES'
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"WARN","fields":{"message":"request failed"}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"ERROR","fields":{"message":"cycle failed"}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"INFO","fields":{"message":"x WARN y"}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"INFO","fields":{"message":"quotes \"level\":\"WARN\""}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"INFO","fields":{"message":"m","level":"WARN"}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"INFO","fields":{"message":"m","level":"ERROR"}}
          {"timestamp":"2026-10-30T10:05:03.367394Z","level":"INFO","fields":{"message":"token thread panicked at x"}}
          2026-10-30T10:05:03.367394Z  WARN yog_api: request failed
          2026-10-30T10:05:03.367394Z ERROR yog_api: cycle failed
          2026-10-30T10:05:03.367394Z  INFO yog_api: x WARN y
          2026-10-30 09:58:53.387 UTC [92] WARNING:  poor compression ratio
          2026-10-30 09:58:53.387 UTC [92] ERROR:  canceling statement due to statement timeout
          2026-10-30 09:58:53.387 UTC [92] FATAL:  terminating autovacuum process
          thread 'main' panicked at crates/api/src/main.rs:1:1:
          LINES
            printf '\033[2m2026-10-30T10:05:03.367394Z\033[0m \033[33m WARN\033[0m \033[2myog_api\033[0m: coloured\n'
          } | awk "$log_levels")
          [ "$counted" = "warn=4 error=5" ] || { echo "counted: $counted, expected warn=4 error=5"; exit 1; }
          echo "every format counted, no message read as a level"

  # The verdict every workflow ends on (.github/actions/verdict/verdict.sh), on
  # results written by hand: its exit code and the reason it gives.
  verdict-gate:
    name: verdict gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Only success and skipped pass, and a refusal names its job
        run: |
          fail=0
          expect() { # <label> <exit code> <text stderr must hold> <RESULTS>; a pass must print nothing on stderr
            local label=$1 want=$2 text=$3 rc=0 err
            err=$(RESULTS=$4 .github/actions/verdict/verdict.sh 2>&1 >/dev/null) || rc=$?
            if [ "$rc" -eq "$want" ] && { [ "$want" -ne 0 ] || [ -z "$err" ]; } && [[ $err == *"$text"* ]]; then
              printf 'ok      %s\n' "$label"
            else
              printf 'FAILED  %s: rc=%s %s\n' "$label" "$rc" "$err"
              fail=1
            fi
          }
          ok='{"result":"success"}'
          skip='{"result":"skipped"}'
          expect "all success" 0 "" "{\"a\":$ok,\"b\":$ok}"
          expect "all skipped" 0 "" "{\"a\":$skip,\"b\":$skip}"
          expect "success and skipped" 0 "" "{\"a\":$ok,\"b\":$skip}"
          for result in failure cancelled abandoned neutral; do
            expect "$result" 1 "b: $result" "{\"a\":$ok,\"b\":{\"result\":\"$result\"},\"c\":$skip}"
          done
          expect "no result" 1 "b: null" "{\"a\":$ok,\"b\":{},\"c\":$skip}"
          expect "not json" 1 "not a non-empty JSON object" "not json"
          expect "empty input" 1 "not a non-empty JSON object" ""
          expect "no job" 1 "not a non-empty JSON object" "{}"
          exit "$fail"

  # `always()` makes it run after a failure — skipped, a required check reads as
  # passed.
  verdict:
    name: Verdict (scripts)
    if: always()
    needs: [changes, shellcheck, actionlint, observe-gate, verdict-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verdict
        with:
          results: ${{ toJSON(needs) }}
