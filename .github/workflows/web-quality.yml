# Static quality checks for the /web Next.js package.
# Runs typecheck, lint, unit tests and the dependency audit as parallel
# jobs so a failure in one does not mask issues in the others.

name: web-quality

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # Read by src/lib/config/__tests__/compose-env.test.ts: a change to the
      # compose alone must still run the test that watches it.
      - "docker-compose.yml"
      - ".github/workflows/web-quality.yml"
  pull_request:
    paths:
      - "web/**"
      # Read by src/lib/config/__tests__/compose-env.test.ts: a change to the
      # compose alone must still run the test that watches it.
      - "docker-compose.yml"
      - ".github/workflows/web-quality.yml"

# Cancel any in-flight run for the same ref when a new commit lands.
# Saves CI minutes during rapid push cycles on PR branches.
concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  # The web counterpart of the Rust `audit` job (crates.yml): a known advisory
  # at moderate or above on a runtime dependency fails the build, unless
  # `web/audit-exceptions.json` accepts it with a written reason. The logic is
  # in `web/audit.sh`, runnable locally as is.
  #
  # Dev dependencies are not audited, by decision: the image ships Next.js's
  # standalone output, not `node_modules`, and no devDependency is imported
  # outside the tests (checked 28 Sept 2026) — an advisory there reaches no
  # visitor. It reads the lockfile alone, so no `npm ci`.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit runtime dependencies
        run: bash audit.sh
