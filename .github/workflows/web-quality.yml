# Static quality checks for the /web Next.js package.
# `changes` decides whether the jobs run on a pull request, and `verdict` is
# the one check the ruleset of main requires (crates/README.md, "CI").
# Runs typecheck, lint, unit tests and the dependency audit as parallel
# jobs so a failure in one does not mask issues in the others.
#
# Every job first installs the npm that `devEngines` in web/package.json
# names: the one Node 24 ships is older, and npm refuses to run in web/
# under another major (EBADDEVENGINES). The guard is the point — two majors
# write the lockfile differently, and a lock one accepts the other can
# reject (`npm ci`: "Missing: … from lock file").

name: web-quality

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # Read by src/lib/config/__tests__/compose-env.test.ts: a change to the
      # compose alone must still run the test that watches it.
      - "docker-compose.yml"
      - ".github/workflows/web-quality.yml"
  # Every pull request, whatever it touches: see the `changes` job.
  pull_request:

# Cancel any in-flight run for the same ref when a new commit lands.
# Saves CI minutes during rapid push cycles on PR branches.
concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  # Decides whether the jobs below run. The workflow starts on every pull
  # request so that its verdict always exists: a required check that never
  # starts stays "Expected" and blocks the merge for good. The work itself
  # only runs when the PR touches this workflow's paths — the same ones the
  # `push:` filter names. On a push to main that filter has already decided.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATTERN: '^(web/|docker-compose\.yml$|\.github/workflows/web-quality\.yml$)'
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          touched=$(grep -E "$PATTERN" <<<"$changed" || true)
          if [ -n "$touched" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "files this workflow checks:"
            echo "$touched"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "no file on this workflow's paths changed: its jobs are skipped"
          fi

  typecheck:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the npm package.json asks for
        run: npm install -g "npm@$(jq -r .devEngines.packageManager.version package.json)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

  lint:
    name: ESLint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the npm package.json asks for
        run: npm install -g "npm@$(jq -r .devEngines.packageManager.version package.json)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  test:
    name: Vitest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the npm package.json asks for
        run: npm install -g "npm@$(jq -r .devEngines.packageManager.version package.json)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  # The web counterpart of the Rust `audit` job (crates.yml): a known advisory
  # at moderate or above on a runtime dependency fails the build, unless
  # `web/audit-exceptions.json` accepts it with a written reason. The logic is
  # in `web/audit.sh`, runnable locally as is.
  #
  # Dev dependencies are not audited, by decision: the image ships Next.js's
  # standalone output, not `node_modules`, and no devDependency is imported
  # outside the tests (checked 28 Sept 2026) — an advisory there reaches no
  # visitor. It reads the lockfile alone, so no `npm ci`.
  audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the npm package.json asks for
        run: npm install -g "npm@$(jq -r .devEngines.packageManager.version package.json)"

      - name: Audit runtime dependencies
        run: bash audit.sh

  # The one check the ruleset of main requires from this workflow: green when
  # every job above passed or was skipped, red when one failed or was
  # cancelled. `always()` is what makes it run after a failure — skipped, a
  # required check reads as passed, which is the one outcome it must not have.
  verdict:
    name: Verdict (web-quality)
    if: always()
    needs: [changes, typecheck, lint, test, audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "a job failed or was cancelled" >&2
            exit 1
          fi
