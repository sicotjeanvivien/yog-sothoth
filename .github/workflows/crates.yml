# Quality checks for the Rust workspace.
#
# Eight jobs in parallel:
#   - check            : `cargo check` across the whole workspace (catches
#                        anything that doesn't compile, including the WASM
#                        crate's host build).
#   - check-per-crate  : `cargo check -p <crate>`, once per workspace member —
#                        catches a crate that only compiles because a sibling
#                        in the same invocation enables a feature for it.
#   - fmt              : `cargo fmt --check`.
#   - clippy           : `cargo clippy` over the native crates (WASM target
#                        still disabled until v0.3).
#   - test             : `cargo test` over the native crates.
#   - test-integration : the DB-backed tests, behind the `integration-tests`
#                        feature, against a real TimescaleDB.
#   - audit            : `cargo audit` on Cargo.lock — vulnerability scan of
#                        the dependency tree.
#   - sqlx-check       : the committed `.sqlx/` cache still matches the
#                        `query!` macros, against a freshly migrated database.
#
# Rust version is pinned by /rust-toolchain.toml — `dtolnay/rust-toolchain@stable`
# reads it automatically, so we never silently inherit a moving target.

name: crates

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/crates.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/crates.yml"

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The .sqlx/ folder is committed; `sqlx::query*!` macros validate
  # against those snapshots instead of needing a live database.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo check --workspace` covers every member (the eight of
      # /Cargo.toml) without listing them, so new crates are picked up
      # automatically. What it CANNOT do is tell whether a member still
      # compiles on its own — see `check-per-crate` below.
      - run: cargo check --workspace --all-targets

  # ─────────────────────────────────────────────────────────────────
  # check-per-crate — does every member still compile ON ITS OWN?
  # ─────────────────────────────────────────────────────────────────
  # Cargo unifies features PER INVOCATION. `check` above passes the whole
  # workspace to a single `cargo` call, so every member silently inherits
  # the features its siblings ask for: a crate that forgot to declare one
  # gets it for free and stays green. One call per crate has nothing to
  # unify. Measured 31 August 2026: `cargo check -p yog-core` returned 261
  # errors while `cargo check --workspace --all-targets` was green, and no
  # job in this file could tell.
  #
  # This does NOT replace `check` — that one covers test and bench targets
  # this loop deliberately leaves out. They are complementary.
  #
  # No `--all-targets` here: cheaper AND stricter. Under resolver v2, not
  # building test targets also avoids unifying dev-dependency features,
  # which could mask the very gap we are looking for.
  #
  # Cost, MEASURED on this workflow (PR #126, 1 Sept 2026): 176s on the very
  # first run — a new job name has no cache to restore — then 42-50s over the
  # three runs that followed, once it had its own. `Check` was 37s / 27s on those same two runs, but was warm both
  # times (its cache came from main). Eight separate invocations do not share
  # the artifacts of one grouped invocation; that gap is the price of the
  # guard. Wall clock: `Test (integration, DB)` sets it at ~130s, so at 50s
  # this job adds nothing; the 176s cold run is the one time it was the
  # longest job (+45s), and it happens once per new cache.
  check-per-crate:
    name: Check (per crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every workspace member compiles on its own
        run: |
          # GitHub's default shell is `bash -e`, errexit only: without
          # pipefail a failing `cargo metadata` is swallowed by `jq`, which
          # exits 0 on empty input, and the guard below would blame an empty
          # member list for what is really a broken `cargo metadata`.
          set -o pipefail
          crates=$(cargo metadata --no-deps --format-version 1 \
                   | jq -r '.packages[].name')
          n=$(echo "$crates" | grep -c . || true)
          echo "$n members: $(echo $crates | tr '\n' ' ')"

          # An empty list would sail through the loop below without
          # compiling anything, and report green. Fail loudly instead.
          if [ "$n" -lt 2 ]; then
            echo "::error::cargo metadata returned $n member(s) — cannot check anything"
            exit 1
          fi

          # Keep going after a failure so one run names EVERY offending
          # crate, the way a `fail-fast: false` matrix would.
          fail=0
          for p in $crates; do
            echo "::group::cargo check -p $p"
            if ! cargo check -p "$p"; then
              echo "::error::$p no longer compiles on its own"
              echo "- \`$p\` no longer compiles on its own" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Native crates only — the WASM crate is a scaffold until v0.3
      # (kept compiling via `check --workspace` above, but not
      # clippy-linted to avoid churn from `wasm-bindgen`-emitted code).
      - run: |
          cargo clippy \
            -p yog-api \
            -p yog-core \
            -p yog-context \
            -p yog-indexer \
            -p yog-persistence \
            -p yog-signals \
            --all-targets --all-features \
            -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p yog-api \
            -p yog-core \
            -p yog-context \
            -p yog-indexer \
            -p yog-persistence \
            -p yog-signals \

  # ─────────────────────────────────────────────────────────────────
  # test-integration — DB-backed tests behind the integration-tests
  # feature. Kept separate from `test` so the pure unit tests stay
  # fast and DB-free; only this job pays the Postgres setup cost.
  # ─────────────────────────────────────────────────────────────────
  test-integration:
    name: Test (integration, DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: yog
          POSTGRES_PASSWORD: yog
          POSTGRES_DB: yog_sothoth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yog -d yog_sothoth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Admin connection: these tests exercise query correctness, not
      # the runtime privilege model. sqlx::test uses this URL to spin
      # up an isolated database per test.
      DATABASE_URL: postgresql://yog:yog@localhost:5432/yog_sothoth

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Roles: the baseline migration emits GRANTs against the runtime roles;
      # create them as bare login roles so the migration applies. sqlx::test
      # re-runs migrations per test database, so the roles must exist at the
      # cluster level (they do — roles are cluster-wide, not per-database).
      #
      # max_background_workers = 0: sqlx::test creates a fresh database per
      # test, each replaying the baseline's continuous-aggregate refresh
      # policies (§13). The TimescaleDB job scheduler (a background worker)
      # then mutates the cluster-wide _timescaledb_catalog asynchronously,
      # racing the next test's cagg-creating migration DDL and failing it with
      # "tuple concurrently deleted" (XX000). Disabling the scheduler removes
      # the only concurrent writer; real-time aggregation still serves reads.
      # The GUC is postmaster-context, so it needs a restart to take effect.
      - name: Pre-create runtime roles and disable TimescaleDB scheduler
        env:
          PGPASSWORD: yog
        run: |
          psql -h localhost -U yog -d yog_sothoth -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE yog_migrate;
          CREATE ROLE yog_indexer;
          CREATE ROLE yog_api;
          CREATE ROLE yog_context;
          CREATE ROLE yog_signals;
          ALTER SYSTEM SET timescaledb.max_background_workers = 0;
          SQL
          docker restart "${{ job.services.postgres.id }}"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -U yog -d yog_sothoth && break
            sleep 1
          done
          test "$(psql -h localhost -U yog -d yog_sothoth -tAc \
            'SHOW timescaledb.max_background_workers;')" = "0"

      # No `-- --include-ignored`: `tests/main.rs` is `#![cfg(feature =
      # "integration-tests")]`-gated, not `#[ignore]`d. The flag was a no-op and
      # the last surviving evidence for a belief the docs used to state and no
      # longer do.
      - name: Run integration tests
        run: |
          cargo test \
            -p yog-persistence \
            --features integration-tests

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        name: Audit Rust Dependencies
        
  # ─────────────────────────────────────────────────────────────────
  # sqlx-check — verify .sqlx/ snapshots are up to date
  # ─────────────────────────────────────────────────────────────────
  # The `query!()` macros are validated at compile time against the
  # `.sqlx/` offline metadata (committed). When a query is added or
  # modified, the developer must regenerate `.sqlx/` locally with
  # `cargo sqlx prepare` and commit the result. This job ensures that
  # step is never forgotten: it spins up a real Postgres in CI,
  # applies the migrations, and compares what the macros WOULD
  # produce against what `.sqlx/` actually contains.
  sqlx-check:
    name: SQLx check
    runs-on: ubuntu-latest
 
    # TimescaleDB image because the baseline migration creates the timescaledb
    # extension and promotes tables to hypertables — a vanilla
    # postgres image would fail the migration.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: yog
          POSTGRES_PASSWORD: yog
          POSTGRES_DB: yog_sothoth
        ports:
          - 5432:5432
        # Health check so the next step waits for Postgres to be
        # ready before applying migrations.
        options: >-
          --health-cmd "pg_isready -U yog -d yog_sothoth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
 
    env:
      # The job connects directly as the admin user (no role split
      # in CI — we are only checking query metadata, not exercising
      # the runtime privilege model).
      DATABASE_URL: postgresql://yog:yog@localhost:5432/yog_sothoth
 
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
 
      # sqlx-cli provides `cargo sqlx prepare --check` and
      # `cargo sqlx migrate run`. --locked uses Cargo.lock to avoid
      # surprise updates; the postgres feature is the only one we
      # need (no MySQL / SQLite drivers compiled in).
      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --version 0.8.6 \
            --no-default-features \
            --features postgres,rustls \
            --locked
 
      # The CI Postgres has no yog_migrate / yog_indexer / yog_api /
      # yog_context roles — the baseline migration emits GRANT statements
      # against them, which would fail. Create them as bare login
      # roles (no passwords needed; CI is ephemeral).
      #
      # max_background_workers = 0: the baseline adds continuous-aggregate
      # refresh policies (§13), after which the TimescaleDB job
      # scheduler (a background worker) starts mutating the cluster-wide
      # _timescaledb_catalog asynchronously, racing the very next cagg
      # DDL and failing it with "tuple concurrently deleted"
      # (intermittently). The test-integration job already
      # disables the scheduler for the same reason; this job needs it too
      # because it applies the same migrations. The GUC is postmaster-
      # context, so it needs a restart to take effect.
      - name: Pre-create runtime roles and disable TimescaleDB scheduler
        env:
          PGPASSWORD: yog
        run: |
          psql -h localhost -U yog -d yog_sothoth -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE yog_migrate;
          CREATE ROLE yog_indexer;
          CREATE ROLE yog_api;
          CREATE ROLE yog_context;
          CREATE ROLE yog_signals;
          ALTER SYSTEM SET timescaledb.max_background_workers = 0;
          SQL
          docker restart "${{ job.services.postgres.id }}"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -U yog -d yog_sothoth && break
            sleep 1
          done
          test "$(psql -h localhost -U yog -d yog_sothoth -tAc \
            'SHOW timescaledb.max_background_workers;')" = "0"
 
      # Apply migrations in the same shape the runtime does, using
      # the standard sqlx CLI command. yog-migrate is the binary
      # form of this same call — we do not build it here because
      # the other jobs already cover it.
      - name: Apply migrations
        run: |
          cargo sqlx migrate run \
            --source crates/persistence/migrations
 
      # The real check: does `.sqlx/` reflect the queries that the
      # macros in the source code currently produce, against the
      # schema we just applied? --check exits non-zero if not.
      - name: Verify .sqlx/ is up to date
        run: |
          cd crates/persistence
          cargo sqlx prepare --check -- --tests
 
  # ── Disabled until v0.3 (WASM activation deferred) ────────────────
