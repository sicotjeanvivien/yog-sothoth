[workspace]
members = [
  "crates/api",
  "crates/archive",
  "crates/bootstrap",
  "crates/context",
  "crates/core",
  "crates/indexer",
  "crates/persistence",
  "crates/signals",
  "crates/wasm",
]
resolver = "2"

# One declaration, inherited by every crate through `license.workspace = true`.
# The terms are in LICENSE at the repository root.
[workspace.package]
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-retry = "0.3"
tokio-util = "0.7"
# `ReceiverStream` — the outbound half of the Yellowstone bidirectional stream:
# the subscription goes out on it, and so does every pong. Already in
# `Cargo.lock` through tonic, so declaring it directly costs no new crate.
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Solana
solana-rpc-client = { version = "4", default-features = false }
solana-rpc-client-api = { version = "4", default-features = false }
solana-commitment-config = { version = "3", default-features = false }
solana-pubsub-client = { version = "4", default-features = false }
# ⚠️ These feature lists are load-bearing and were implicit until 31 August 2026:
# `solana-transaction-status` used to enable `borsh` and `serde` on `Pubkey` and
# `serde` on `Signature` as a side effect of being in the graph. Removing it —
# it was unused — took those with it, and `cargo check -p yog-core` stopped
# compiling while `--workspace` stayed green, feature unification hiding it
# behind `yog-indexer`. Declared here so the crates that need them say so.
solana-pubkey = { version = "4", default-features = false, features = [
    "borsh",
    "serde",
    "std",
] }
solana-signature = { version = "3", default-features = false, features = [
    "serde",
    "std",
] }
solana-transaction-status-client-types = "4"

# Yellowstone gRPC — the SCHEMA only, never the client.
#
# `yellowstone-grpc-client` carries the connection, the authentication and the
# reconnection: provider opinions, i.e. an SDK we chose not to depend on.
# It also derives `Debug` on `InterceptorXToken` and `GeyserGrpcBuilder`, both
# holding a `pub x_token` whose `AsciiMetadataValue` is not marked sensitive —
# any `{:?}` writes the token in the clear. `-proto` is a public schema plus a
# `prost` build: regenerated here it comes out identical, so there is no
# "Triton version" of the types to be locked into.
#
# ⚠️ Pinned to 12 and not 10, for a build reason found in review: 10.1.1 builds
# protobuf 21.5 from C++ source via `protobuf-src`/`autotools`, and the backend
# builder image (`rust:1.98-slim-bookworm` plus pkg-config, libssl-dev,
# ca-certificates) carries `cc` but **no `g++` and no `make`** — rechecked in
# the 1.98 image on 25 September 2026. Measured in the 1.95 image it replaced,
# which lacked the same tools: 10.1.1 dies on `ToolNotFound: failed to find
# tool "c++"`, 12.7.0 compiles in 19 s — it replaced `protobuf-src` with `protoc-bin-vendored`,
# prebuilt binaries needing no toolchain. CI would have stayed green
# (ubuntu-latest ships g++), so `docker compose --profile backend up --build`
# would have been the first thing to break — on a machine, not in a pipeline.
yellowstone-grpc-proto = { version = "12", default-features = false }

# The gRPC transport under that schema. Declared here only to add TLS: the
# proto crate already pulls `tonic` with its default features (`router`,
# `server`, `codegen`), which cannot be turned off from a dependent, and none
# of those defaults includes TLS.
#
# `tls-ring` over `tls-aws-lc`: `ring` is already compiled in this tree
# (rustls ← reqwest, hyper-rustls), while `aws-lc-sys` builds C with cmake.
# `tls-webpki-roots` over `tls-native-roots` for the same reason the WebSocket
# path already uses it — the trust anchors ship with the binary instead of
# depending on what the runtime image installed.
tonic = { version = "0.14", default-features = false, features = [
    "tls-ring",
    "tls-webpki-roots",
] }

# Database
sqlx = { version = "0.9", default-features = false }
bigdecimal = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Errors
thiserror = "2"
anyhow = "1"

metrics = "0.24"
metrics-exporter-prometheus = "0.18"
# Test-only (dev-dependency of yog-indexer): `DebuggingRecorder` lets a test
# assert on emitted counters. Pinned here so it cannot drift from the version
# `metrics-exporter-prometheus` resolves.
metrics-util = "0.20"

# Misc
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
borsh = { version = "1", features = ["derive"] }

rustls = { version = "0.23", features = ["ring"] }

bs58 = "0.5"
base64 = "0.23"
sha2 = "0.11"
rust_decimal = "1.43"

# Axum
axum = "0.8.9"
# Test-only: `ServiceExt::oneshot` drives a router without a socket. Already
# compiled with `util` through axum, so declaring it costs no new crate.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "request-id",
  "set-header",
] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13", features = ["json", "rustls"] }

# yog-archive — the object store its dumps go to. Chosen over `rusty-s3` on
# measurement (23 September 2026): 9 new packages in the lock against 16, no
# build script among them, and it reuses the `reqwest` above. It also brings
# the multipart upload with its abort, and an in-memory store the tests use.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
# Already in the lock through reqwest: splitting the password out of the
# connection string that `pg_dump` receives.
url = "2"
percent-encoding = "2"
