[workspace]
members = [
  "crates/api",
  "crates/bootstrap",
  "crates/context",
  "crates/core",
  "crates/indexer",
  "crates/persistence",
  "crates/signals",
  "crates/wasm",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-retry = "0.3"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Solana
solana-rpc-client = { version = "4", default-features = false }
solana-rpc-client-api = { version = "4", default-features = false }
solana-commitment-config = { version = "3", default-features = false }
solana-pubsub-client = { version = "4", default-features = false }
# ⚠️ These feature lists are load-bearing and were implicit until 31 August 2026:
# `solana-transaction-status` used to enable `borsh` and `serde` on `Pubkey` and
# `serde` on `Signature` as a side effect of being in the graph. Removing it —
# it was unused — took those with it, and `cargo check -p yog-core` stopped
# compiling while `--workspace` stayed green, feature unification hiding it
# behind `yog-indexer`. Declared here so the crates that need them say so.
solana-pubkey = { version = "4", default-features = false, features = [
    "borsh",
    "serde",
    "std",
] }
solana-signature = { version = "3", default-features = false, features = [
    "serde",
    "std",
] }
solana-transaction-status-client-types = "4"

# Yellowstone gRPC — the SCHEMA only, never the client.
#
# `yellowstone-grpc-client` carries the connection, the authentication and the
# reconnection: provider opinions, and a SDK in the sense the ticket refuses.
# It also derives `Debug` on `InterceptorXToken` and `GeyserGrpcBuilder`, both
# holding a `pub x_token` whose `AsciiMetadataValue` is not marked sensitive —
# any `{:?}` writes the token in the clear. `-proto` is a public schema plus a
# `prost` build: regenerated here it comes out identical, so there is no
# "Triton version" of the types to be locked into.
#
# ⚠️ Pinned to 12 and not 10, for a build reason found in review: 10.1.1 builds
# protobuf 21.5 from C++ source via `protobuf-src`/`autotools`, and the backend
# builder image (`rust:1.95-slim-bookworm` plus pkg-config, libssl-dev,
# ca-certificates) carries `cc` but **no `g++` and no `make`**. Measured in that
# exact image: 10.1.1 dies on `ToolNotFound: failed to find tool "c++"`, 12.7.0
# compiles in 19 s — it replaced `protobuf-src` with `protoc-bin-vendored`,
# prebuilt binaries needing no toolchain. CI would have stayed green
# (ubuntu-latest ships g++), so `docker compose --profile backend up --build`
# would have been the first thing to break — on a machine, not in a pipeline.
yellowstone-grpc-proto = { version = "12", default-features = false }

# Database
sqlx = { version = "0.8", default-features = false }
bigdecimal = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Errors
thiserror = "2"
anyhow = "1"

metrics = "0.24"
metrics-exporter-prometheus = "0.18"
# Test-only (dev-dependency of yog-indexer): `DebuggingRecorder` lets a test
# assert on emitted counters. Pinned here so it cannot drift from the version
# `metrics-exporter-prometheus` resolves.
metrics-util = "0.20"

# Misc
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
borsh = { version = "1", features = ["derive"] }

rustls = { version = "0.23", features = ["ring"] }

bs58 = "0.5"
base64 = "0.22"
sha2 = "0.11"
rust_decimal = "1"

# Axum
axum = "0.8.9"
tower-http = { version = "0.6.10", features = [
  "cors",
  "trace",
  "request-id",
  "set-header",
] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13", features = ["json", "rustls"] }
